services:
 - type: web
   name: vaultwarden
   runtime: docker
   dockerfilePath: ./Dockerfile
   plan: free
   autoDeploy: false
   envVars:
     - key: DOMAIN
       value: "https://vaultwarden.jyrac.stki.org"
     # ROCKET_PORT は、ここには書かない（ゲートが $PORT を受け、Vaultwarden は内側の 3457 で待ち受ける。
     # Dockerfile の GATE_CHILD_ENV で設定済み。Render の環境変数に残っていても、上書きされるので無害）
     - key: DATABASE_MAX_CONNS
       value: "3"
     - key: SIGNUPS_ALLOWED
       value: "true"
     - key: INVITATIONS_ALLOWED
       value: "true"
     - key: ORG_CREATION_USERS
       value: "jyrac.vaultwarden@render.stki.org"
     - key: ORG_GROUPS_ENABLED
       value: "true"
     - key: SSO_ENABLED
       value: "true"
     - key: SSO_ONLY
       value: "true"
     - key: SSO_AUTHORITY
       value: "https://auth.jyrac.stki.org"
     - key: SSO_CLIENT_ID
       value: "288f481bd9ee4ab6d1c6"
     - key: SSO_SCOPES
       value: "openid profile email offline_access"
     - key: SSO_PKCE
       value: "true"
     - key: SSO_SIGNUPS_MATCH_EMAIL
       value: "true"
     - key: EXTENDED_LOGGING
       value: "true"
     - key: LOG_LEVEL
       value: "info"
     - key: IP_HEADER
       value: "CF-Connecting-IP"
     # ---- IPゲート（GATE_DB_USER / GATE_DB_PASSWORD は、Agentが出すので、ここには書かない）----
     # GATE_CHILD_CMD / GATE_CHILD_ENV / GATE_UPSTREAM / GATE_UPSTREAM_HEALTH_PATH / GATE_WAIT_READY_SEC は、
     # Dockerfile で設定済み。Vaultwarden には、公開の読み取りの例外（GATE_PUBLIC_RULES）は、無い。
     - key: GATE_MODE
       value: "observe"
     - key: GATE_DB_HOST
       value: "aws-0-us-west-2.pooler.supabase.com"
     - key: GATE_DB_PORT
       value: "6543"
     - key: GATE_DB_NAME
       value: "postgres"
     - key: GATE_DB_SSLMODE
       value: "require"
     - key: GATE_DENIED_URL
       value: "https://gate.jyrac.stki.org/denied"
     - key: GATE_REDIRECT_URL
       value: "https://gate.jyrac.stki.org/"